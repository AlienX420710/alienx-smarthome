name: AlienX Safari Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari / WebKit compatibility
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 --host 127.0.0.1 --upstream-protocol http > /tmp/site-preview.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/site-preview.log
          exit 1

      - name: Enable full keyboard navigation on macOS
        run: |
          defaults write -g AppleKeyboardUIMode -int 3
          defaults write -g WebKitTabToLinksPreferenceKey -bool true
          defaults write com.apple.Safari WebKitTabToLinksPreferenceKey -bool true

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Run Safari compatibility checks
        run: node tests/safari.cjs

      - name: Install Playwright WebKit
        if: success() || failure()
        run: npx playwright install webkit

      - name: Run WebKit navigation and keyboard interactions
        if: success() || failure()
        run: npm run test:webkit

      - name: Retain full-page canvas captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-page-captures
          path: test-results/**/full-page-canvas.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Safari diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-preview-log
          path: |
            /tmp/site-preview.log
            safari-diagnostics
            test-results
          if-no-files-found: ignore
