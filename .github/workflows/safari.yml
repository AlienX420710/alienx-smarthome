name: AlienX Safari Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari / WebKit compatibility
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-safari.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-safari.log
          exit 1

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      - name: Run Safari compatibility checks
        run: |
          node tests/safari.cjs

      - name: Upload Safari diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safari-preview-log
          path: /tmp/alienx-safari.log
          if-no-files-found: ignore
