name: AlienX Safari Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: Safari / WebKit compatibility
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-safari.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-safari.log
          exit 1

      - name: Enable Safari WebDriver
        run: sudo safaridriver --enable

      # Safari/WebDriver can occasionally race page-level theme initialization.
      # Retry once before treating the compatibility check as a warning.
      # This job is diagnostic and must not block a valid production build.
      - name: Run Safari compatibility checks
        id: safari-check
        continue-on-error: true
        run: |
          set +e

          node tests/safari.cjs
          first_exit=$?

          if [ "$first_exit" -eq 0 ]; then
            exit 0
          fi

          echo "::warning::Safari compatibility check failed on the first attempt; retrying once after Safari settles."
          sleep 3

          node tests/safari.cjs
          second_exit=$?

          if [ "$second_exit" -ne 0 ]; then
            echo "::warning::Safari compatibility checks failed twice. This is reported as a compatibility warning and will not block the production build."
          fi

          exit "$second_exit"

      - name: Report Safari compatibility warning
        if: steps.safari-check.outcome == 'failure'
        run: |
          echo "::warning::Safari/WebKit compatibility diagnostics failed after retry. Review the uploaded Safari diagnostics, but production deployment remains unblocked."

      - name: Upload Safari diagnostics on compatibility failure
        if: steps.safari-check.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safari-preview-log
          path: /tmp/alienx-safari.log
          if-no-files-found: ignore
