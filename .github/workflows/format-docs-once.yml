name: Format docs once

on:
  push:
    branches:
      - docs/update-project-state-2026-09-14

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/update-project-state-2026-09-14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/project-state.md docs/frontend-pattern-notes.md
      - run: npm run format:check
      - name: Commit formatted docs and remove one-shot workflow
        run: |
          rm .github/workflows/format-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-state.md docs/frontend-pattern-notes.md .github/workflows/format-docs-once.yml
          git commit -m "docs: format project notes [formatted]"
          git push origin HEAD:docs/update-project-state-2026-09-14
