name: Format security follow-up once

on:
  push:
    branches:
      - security/close-csp-history-findings
    paths:
      - .github/workflows/format-security-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/close-csp-history-findings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/history-secret-scan.mjs .github/workflows/quality.yml astro.config.mjs
      - run: npm run format:check
      - name: Commit formatted result and remove one-shot workflow
        run: |
          rm .github/workflows/format-security-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: format CSP and history audit follow-up"
          git push origin HEAD:security/close-csp-history-findings
