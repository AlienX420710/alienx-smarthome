name: AlienX Operator Alert

on:
  workflow_run:
    workflows:
      - AlienX Production Smoke
      - AlienX Production Integrity
      - AlienX Release Approval
      - AlienX Alert Canary
      - AlienX Contact Form Health
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  alert:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Open operator alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT

          node - "$payload" <<'NODE'
          const fs = require('node:fs');

          const file = process.argv[2];
          const runName = process.env.RUN_NAME;
          const body = [
            'Automated operator alert from the trusted repository workflow controller.',
            '',
            `- Workflow: \`${runName}\``,
            `- Run: ${process.env.RUN_URL}`,
            `- Run ID: \`${process.env.RUN_ID}\``,
            `- Event: \`${process.env.RUN_EVENT}\``,
            `- Head SHA: \`${process.env.HEAD_SHA}\``,
            '',
            'This alert is generated from GitHub Actions evidence only. It does not read mailbox contents, provider message history, or customer message content.',
          ].join('\n');

          fs.writeFileSync(
            file,
            JSON.stringify({
              title: `[Operator Alert] ${runName} failed`,
              body,
            }),
          );
          NODE

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@${payload}" \
            "https://api.github.com/repos/${REPOSITORY}/issues"
