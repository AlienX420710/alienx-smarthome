name: TEMP Format VEX Files

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/dependency-audit.mjs
      - tests/dependency-audit.test.cjs
      - .github/workflows/format-vex-temp.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format VEX files
        run: npx prettier scripts/dependency-audit.mjs tests/dependency-audit.test.cjs --write

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-vex-files
          path: |
            scripts/dependency-audit.mjs
            tests/dependency-audit.test.cjs
          if-no-files-found: error
          retention-days: 1
