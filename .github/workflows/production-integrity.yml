name: AlienX Production Integrity

on:
  workflow_run:
    workflows:
      - AlienX Production Smoke
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-integrity-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Deployed revision security and SEO
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted verification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked verification tooling
        run: npm ci

      - name: Verify deployed security and SEO
        env:
          EXPECTED_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node scripts/verify-integrity.mjs
