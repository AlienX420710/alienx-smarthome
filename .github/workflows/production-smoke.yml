name: AlienX Production Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact verification revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked verification tooling
        run: npm ci
      - name: Wait for exact production revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-release.mjs
      - name: Verify production smoke without sending mail
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-smoke.mjs
