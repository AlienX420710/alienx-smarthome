name: AX-007 and AX-009 one-shot preflight

on:
  push:
    branches: [cleanup/ax007-ax009]

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply scoped cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          quality = Path('.github/workflows/quality.yml')
          text = quality.read_text()
          checkout_old = """      - name: Checkout\n        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n"""
          checkout_new = checkout_old + """        with:\n          fetch-depth: 0\n"""
          if checkout_old not in text:
              raise SystemExit('quality checkout anchor not found')
          text = text.replace(checkout_old, checkout_new, 1)
          audit_old = """      - name: Repository security audit\n        run: npm run security:audit\n"""
          audit_new = audit_old + """\n      - name: Historical secret audit\n        run: node scripts/security-history-audit.mjs\n"""
          if audit_old not in text:
              raise SystemExit('quality security audit anchor not found')
          text = text.replace(audit_old, audit_new, 1)
          quality.write_text(text)

          css_path = Path('src/styles/global.css')
          css = css_path.read_text()

          def block_span(source, selector):
              start = source.find(selector)
              if start < 0:
                  raise SystemExit(f'CSS selector not found: {selector}')
              brace = source.find('{', start)
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == '{':
                      depth += 1
                  elif source[index] == '}':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          while end < len(source) and source[end] in '\r\n':
                              end += 1
                          return start, end
              raise SystemExit(f'Unclosed CSS block: {selector}')

          canonical = ":root[data-alienx-theme='dark']"
          start, end = block_span(css, canonical)
          block = css[start:end]
          if 'color-scheme: dark;' not in block:
              block = block.replace('{\n', '{\n  color-scheme: dark;\n', 1)
          css = css[:start] + block + css[end:]

          for selector in (
              ":root:where([data-alienx-theme='dark'])",
              "html[data-alienx-theme='dark']",
          ):
              start, end = block_span(css, selector)
              css = css[:start] + css[end:]

          css_path.write_text(css)

          state_path = Path('docs/project-state.md')
          state = state_path.read_text()
          state = state.replace(
              "AX-006 and AX-008 still require owner/device evidence. AX-004 and AX-007 remain\nsecurity follow-ups unless separately closed by newer evidence. AX-009 and\nAX-010 remain longer-term work.",
              "AX-006 and AX-008 still require owner/device evidence. AX-004 and AX-007 are\nverified at `e69c280`; AX-009 is the next scoped repository cleanup, and\nAX-010 remains longer-term work.",
          )
          state = state.replace(
              "| AX-004 | P2 / open                       | Three manual CSP hashes in `astro.config.mjs` have no documented source mapping.                                                       | Map allowances to exact emitted bytes or prove an allowance obsolete; built-browser verification shows no required script blocked.            |",
              "| AX-004 | P2 / verified at e69c280       | Three manual CSP hashes lacked documented source mapping; a clean Astro 7.3.2 build proved all three obsolete and they were removed. | Clean-build mapping found no emitted inline script requiring them; all required browser gates and deployed Integrity passed without them.     |",
          )
          state = state.replace(
              "| AX-007 | P2 / open                       | Historical secret scan is not recorded.                                                                                                | Full-history scan with tool/version, scope, date, and sanitized outcome; any confirmed exposed secrets rotated by owner.                      |",
              "| AX-007 | P2 / verified at e69c280       | Full reachable-history credential scanning is implemented with sanitized output and recorded in repository CI.                         | `security-history-audit.mjs` scans reachable text blobs with eight detector classes, suppresses values, and passed the verified preflight.     |",
          )
          state = state.replace(
              "1. Finish repository-only security follow-ups that can be proven without owner\n   intervention: AX-004 CSP hash mapping and AX-007 historical secret scanning.",
              "1. Preserve the verified AX-004 CSP cleanup and AX-007 historical-secret scan;\n   keep the history scan in the required Quality path so regressions fail closed.",
          )
          marker = "### Earlier dependency release\n"
          section = """### Security follow-up closure — 2026-09-14 (verified at e69c280)\n\nAX-004 and AX-007 are closed by repository evidence at\n`e69c280fe6fd2a7eabb547fb4b7f8fff11ec0ced`. A clean Astro 7.3.2 build\nfound no emitted inline script matching the three manual CSP hashes, so those\nallowances were removed without broadening the remaining policy. The same\nrevision passed the required browser gates, Cloudflare deployment, Production\nSmoke, and post-Smoke Production Integrity.\n\nThe historical credential scanner walks all reachable Git objects, ignores\nbinary and oversized content for value matching, uses eight sanitized detector\nclasses, and never prints matched secret values. Its verified preflight passed\nwith no credential-like findings. The follow-up Quality integration makes the\nfull-history scan part of every required Quality run instead of leaving it as a\nstandalone opt-in workflow.\n\n"""
          if marker not in state:
              raise SystemExit('project-state insertion anchor not found')
          state = state.replace(marker, section + marker, 1)
          state_path.write_text(state)
          PY
          rm -f .github/workflows/security-history.yml

      - name: Format final changed files
        run: npx prettier --write src/styles/global.css docs/project-state.md .github/workflows/quality.yml .github/workflows/ax007-ax009-once.yml

      - name: Verify formatting
        run: npm run format:check

      - name: Run historical secret audit
        run: node scripts/security-history-audit.mjs

      - name: Test
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run

      - name: Commit final cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/ax007-ax009-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: close AX-007 and scope AX-009 cleanup'
          git push
