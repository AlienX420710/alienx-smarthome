name: Diagnose CSP hashes once

on:
  push:
    branches:
      - security/close-csp-history-findings
    paths:
      - .github/workflows/diagnose-csp-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/close-csp-history-findings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start built Worker locally
        run: |
          npx wrangler dev --local --port 4321 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4321/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Map configured CSP hashes to emitted inline scripts
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const config = await readFile('astro.config.mjs', 'utf8');
          const configured = [...config.matchAll(/'sha256-([^']+)'/g)].map((m) => `sha256-${m[1]}`);
          const routes = ['/', '/work/', '/experience/', '/technology/', '/status/', '/about/', '/contact/', '/lab/'];
          const found = new Map(configured.map((hash) => [hash, []]));
          for (const route of routes) {
            const html = await (await fetch(`http://127.0.0.1:4321${route}`)).text();
            const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match, index) => {
              if (/\bsrc\s*=/.test(match[1])) return;
              const hash = `sha256-${createHash('sha256').update(match[2]).digest('base64')}`;
              if (found.has(hash)) found.get(hash).push(`${route} inline-script-${index + 1}`);
            });
          }
          console.log('Configured CSP hash mapping:');
          for (const [hash, locations] of found) console.log(`${hash} => ${locations.length ? locations.join(', ') : 'UNMATCHED'}`);
          if ([...found.values()].some((locations) => locations.length === 0)) process.exitCode = 2;
          NODE
      - name: Cleanup one-shot workflow
        if: always()
        run: |
          git rm .github/workflows/diagnose-csp-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore: remove CSP diagnostic workflow'
          git push origin HEAD:security/close-csp-history-findings
