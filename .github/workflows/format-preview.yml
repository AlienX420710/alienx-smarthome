name: Temporary Format Preview

on:
  pull_request:
    paths:
      - docs/project-state.md
      - .github/workflows/format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show canonical project-state formatting
        run: |
          npx prettier --write docs/project-state.md
          git diff -- docs/project-state.md
