name: Temporary Format Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print canonical formatting
        run: |
          npx prettier --write scripts/security-audit.mjs
          echo '---FORMATTED FILE START---'
          cat scripts/security-audit.mjs
          echo '---FORMATTED FILE END---'
