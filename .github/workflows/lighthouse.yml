name: AlienX Lighthouse Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-lighthouse.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-lighthouse.log
          exit 1

      - name: Run Lighthouse quality gate
        run: npm run test:lighthouse

      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-diagnostics
          path: |
            /tmp/alienx-lighthouse.log
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
