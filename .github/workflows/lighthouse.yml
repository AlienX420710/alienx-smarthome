name: AlienX Lighthouse Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-lighthouse.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-lighthouse.log
          exit 1

      - name: Run Lighthouse quality gate
        run: |

          set +e
          npx --no-install lhci autorun --config=lighthouse.config.cjs
          LHCI_STATUS=$?
          set -e

          node <<'REPORT'
          const fs = require('fs');
          const path = '.lighthouseci';
          if (!fs.existsSync(path)) process.exit(0);
          for (const file of fs.readdirSync(path).filter(name => name.endsWith('.json'))) {
            try {
              const report = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'));
              if (!report.categories || !report.audits) continue;
              console.log(`\nLighthouse diagnostics: ${report.finalUrl || report.requestedUrl || file}`);
              for (const [id, category] of Object.entries(report.categories)) {
                const score = category.score;
                if (typeof score === 'number') console.log(`  ${id}: ${(score * 100).toFixed(0)}`);
                if (typeof score !== 'number' || score >= (id === 'performance' ? 0.85 : 0.95)) continue;
                for (const ref of category.auditRefs || []) {
                  const audit = report.audits[ref.id];
                  if (audit && typeof audit.score === 'number' && audit.score < 1) {
                    console.log(`    FAIL ${ref.id}: ${audit.title} (score ${audit.score})`);
                  }
                }
              }
            } catch (error) {
              console.log(`Could not parse Lighthouse report ${file}: ${error.message}`);
            }
          }
          REPORT

          exit "$LHCI_STATUS"

      - name: Upload Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-diagnostics
          path: |
            /tmp/alienx-lighthouse.log
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
