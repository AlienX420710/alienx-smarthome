name: AlienX Lighthouse Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-lighthouse.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-lighthouse.log
          exit 1

      - name: Run Lighthouse quality gate
        run: |
          cat > lighthouserc.cjs <<'LIGHTHOUSE'
          module.exports = {
            ci: {
              collect: {
                url: [
                  'http://127.0.0.1:4321/',
                  'http://127.0.0.1:4321/work/',
                  'http://127.0.0.1:4321/experience/',
                  'http://127.0.0.1:4321/technology/',
                  'http://127.0.0.1:4321/status/',
                  'http://127.0.0.1:4321/about/',
                  'http://127.0.0.1:4321/contact/'
                ],
                numberOfRuns: 1,
                settings: {
                  onlyCategories: ['accessibility', 'best-practices', 'performance', 'seo']
                }
              },
              assert: {
                assertions: {
                  'categories:accessibility': ['error', { minScore: 0.95 }],
                  'categories:best-practices': ['error', { minScore: 0.95 }],
                  'categories:performance': ['error', { minScore: 0.85 }],
                  'categories:seo': ['error', { minScore: 0.95 }]
                }
              },
              upload: { target: 'filesystem', outputDir: '.lighthouseci' }
            }
          };
          LIGHTHOUSE

          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Upload Lighthouse diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-diagnostics
          path: |
            /tmp/alienx-lighthouse.log
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
