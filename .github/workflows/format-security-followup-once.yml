name: Format security follow-up once

on:
  push:
    branches: [security/close-csp-history-audit]
    paths: [.github/workflows/format-security-followup-once.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/close-csp-history-audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/security-history-audit.mjs .github/workflows/security-history.yml astro.config.mjs
      - run: npm run format:check
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git rm .github/workflows/format-security-followup-once.yml
          git add scripts/security-history-audit.mjs .github/workflows/security-history.yml astro.config.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'security: apply pinned formatting'
          git push origin HEAD:security/close-csp-history-audit
