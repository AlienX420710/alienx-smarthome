name: Temporary Security Formatting

on:
  push:
    branches:
      - security/release-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/release-hardening

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatter
        run: npm run format

      - name: Remove temporary workflow
        run: rm .github/workflows/format-security.yml

      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/security-audit.mjs scripts/verify-integrity.mjs .github/workflows/format-security.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: apply repository formatting"
          git push origin HEAD:security/release-hardening
