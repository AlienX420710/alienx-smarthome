name: Browser Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/webkit-diagnostics.cjs
      - tests/webkit-diagnostics.test.cjs
      - .github/workflows/browser-diagnostics.yml
      - engineering.config.json

permissions:
  contents: read

jobs:
  diagnose:
    name: Isolated WebKit load diagnostics
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build candidate
        run: npm run build
      - name: Install WebKit
        run: npx playwright install webkit
      - name: Start local preview
        run: npx wrangler dev --port 4321 --host 127.0.0.1 --upstream-protocol http > /tmp/browser-diagnostics.log 2>&1 &
      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/browser-diagnostics.log
          exit 1
      - name: Run isolated diagnostics
        run: node scripts/webkit-diagnostics.cjs
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-diagnostics
          path: |
            /tmp/browser-diagnostics.log
            test-results/webkit-diagnostics
          if-no-files-found: warn
