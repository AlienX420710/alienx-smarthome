name: AlienX Contact Form Health

on:
  schedule:
    # 05:20 America/Chicago: one of these UTC candidates is selected by the local-time guard.
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select 05:20 America/Chicago candidate
        id: local-time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=America/Chicago date +%H:%M)" == "05:20" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the 05:20 America/Chicago candidate; skipping."
          fi

      - name: Checkout trusted monitor
        if: steps.local-time.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.local-time.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        if: steps.local-time.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.local-time.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify production Contact form
        if: steps.local-time.outputs.run == 'true'
        run: node scripts/verify-contact-form-health.mjs
