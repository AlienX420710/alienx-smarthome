name: AlienX Contact Form Health

on:
  schedule:
    # 05:20 America/Chicago: one of these UTC candidates is selected by the local-time guard.
    - cron: '20 10 * * *'
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require 05:20 America/Chicago
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(TZ=America/Chicago date +%H:%M)" != "05:20" ]]; then
            echo "Not the 05:20 America/Chicago candidate; skipping."
            exit 0
          fi

      - name: Checkout trusted monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production Contact form
        run: node scripts/verify-contact-form-health.mjs
