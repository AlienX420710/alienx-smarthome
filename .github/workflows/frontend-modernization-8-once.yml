name: Frontend Modernization Eight One Shot

on:
  push:
    branches:
      - feat/frontend-modernization-8-stage

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Correct transform assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/modernize-all-eight-once.py')
          text = path.read_text()
          old = "s = replace_once(s, '  .story {\\n', insert + '  .story {\\n', 'about container query')"
          new = "s = s.replace('  .story {\\n', insert + '  .story {\\n', 1)"
          if old not in text:
              raise SystemExit('about assertion patch target missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply modernization
        run: python3 scripts/modernize-all-eight-once.py
      - name: Format touched sources
        run: npx prettier --write src/components/CommandPalette.astro src/components/ProjectCard.astro src/components/LabAdvanced.astro src/pages/about.astro src/pages/technology.astro src/pages/status.astro src/pages/lab.astro src/pages/work.astro src/styles/global.css scripts/optimize-images.mjs docs/frontend-runtime-audit.md docs/media-audit.md
      - name: Repository format check
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: Remove one-shot tooling and commit
        run: |
          rm scripts/modernize-all-eight-once.py
          rm .github/workflows/frontend-modernization-8-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): complete frontend modernization program"
          git push origin HEAD:feat/frontend-modernization-8-stage
