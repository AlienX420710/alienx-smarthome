name: AlienX Responsive Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    name: Responsive viewport matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-preview.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-preview.log
          exit 1

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run responsive compatibility matrix
        run: |
          cat > tests-responsive.spec.cjs <<'TEST'
          const { test, expect } = require('@playwright/test');

          const baseURL = 'http://127.0.0.1:4321';
          const routes = ['/', '/work/', '/experience/', '/technology/', '/status/', '/about/', '/contact/'];
          const viewports = [
            [320,568],[360,800],[375,667],[390,844],[430,932],
            [540,720],[768,1024],[820,1180],[1024,768],[1280,800],[1440,900],[1920,1080]
          ];

          test.describe.configure({ mode:'serial' });

          for (const [width,height] of viewports) for (const route of routes) {
            test(`${route} @ ${width}x${height}`, async ({page}) => {
              const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error') errors.push(`console: ${m.text()}`);});

              await page.setViewportSize({width,height});
              await page.goto(`${baseURL}${route}`,{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(500);

              const result=await page.evaluate(()=>{
                const offenders=[];
                for(const el of document.querySelectorAll('*')){
                  const r=el.getBoundingClientRect();
                  if(r.width>0&&(r.right>innerWidth+1||r.left<-1)) offenders.push({tag:el.tagName,id:el.id,className:String(el.className).slice(0,120),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width)});
                }
                return {viewportWidth:innerWidth,documentWidth:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),offenders:offenders.slice(0,12)};
              });

              expect(result.documentWidth,`Horizontal overflow: ${JSON.stringify(result.offenders)}`).toBeLessThanOrEqual(result.viewportWidth+1);
              expect(errors,`Runtime errors at ${width}x${height}`).toEqual([]);
            });
          }
          TEST

          npx playwright test tests-responsive.spec.cjs --reporter=line

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-preview-log
          path: /tmp/alienx-preview.log
          if-no-files-found: ignore
