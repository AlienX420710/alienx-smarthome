name: TEMP Format Project State

on:
  pull_request:
    branches: [main]
    paths:
      - docs/project-state.md
      - .github/workflows/format-project-state-temp.yml

permissions:
  contents: read

jobs:
  format-project-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format project state
        run: npx prettier docs/project-state.md --write

      - name: Upload formatted project state
        uses: actions/upload-artifact@v4
        with:
          name: formatted-project-state
          path: docs/project-state.md
          if-no-files-found: error
          retention-days: 1
