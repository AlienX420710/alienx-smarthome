name: AlienX Accessibility & Theme Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Light, dark, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-accessibility.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-accessibility.log
          exit 1

      - name: Install browser accessibility tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Test light and dark themes with axe
        run: |
          cat > tests-accessibility.spec.cjs <<'TEST'
          const { test, expect } = require('@playwright/test');
          const axe = require('axe-core');

          const baseURL = 'http://127.0.0.1:4321';
          const routes = ['/', '/work/', '/experience/', '/technology/', '/status/', '/about/', '/contact/'];
          const themes = ['light', 'dark'];

          test.describe.configure({ mode: 'serial' });

          for (const theme of themes) {
            for (const route of routes) {
              test(`${theme} theme: ${route}`, async ({ page }) => {
                await page.addInitScript(({ selectedTheme }) => {
                  try { localStorage.setItem('alienx-theme', selectedTheme); } catch {}
                }, { selectedTheme: theme });

                await page.addInitScript({ content: axe.source });
                await page.emulateMedia({ colorScheme: theme, reducedMotion: 'reduce' });
                await page.goto(`${baseURL}${route}`, { waitUntil: 'domcontentloaded' });

                await page.evaluate((selectedTheme) => {
                  document.documentElement.dataset.alienxTheme = selectedTheme;
                }, theme);
                await expect(page.locator('html')).toHaveAttribute('data-alienx-theme', theme);

                if (route === '/status/') {
                  await expect(page.locator('#checks')).toHaveAttribute('aria-busy', 'false', { timeout: 5000 });
                  await expect(page.locator('#checks .check')).toHaveCount(4, { timeout: 1000 });
                } else {
                  await page.waitForTimeout(500);
                }

                const visualHeadings = await page.evaluate(() => [...document.querySelectorAll('h1,h2,h3')]
                  .filter((heading) => heading.textContent?.trim())
                  .map((heading) => {
                    const rect = heading.getBoundingClientRect();
                    const style = getComputedStyle(heading);
                    return {
                      text: heading.textContent.trim().slice(0, 100),
                      width: rect.width,
                      height: rect.height,
                      visibility: style.visibility,
                      display: style.display,
                      opacity: Number(style.opacity),
                      color: style.color
                    };
                  }));

                expect(
                  visualHeadings.filter((heading) => heading.width <= 0 || heading.height <= 0 || heading.visibility === 'hidden' || heading.display === 'none' || heading.opacity === 0),
                  `${theme} visually hidden headings on ${route}: ${JSON.stringify(visualHeadings)}`
                ).toEqual([]);

                // Catch theme-token leaks that can leave an otherwise rendered heading
                // effectively invisible on a light/dark surface. Axe normally catches
                // this too, but this explicit contract makes the failure diagnostic and
                // guarantees the selected theme is actually being audited.
                const headingContrast = await page.evaluate(() => {
                  const parse = (value) => {
                    const match = value.match(/rgba?\(([^)]+)\)/);
                    if (!match) return null;
                    const parts = match[1].split(',').map(Number);
                    return { r: parts[0], g: parts[1], b: parts[2], a: parts[3] ?? 1 };
                  };
                  const luminance = ({r,g,b}) => {
                    const channel = (value) => {
                      const normalized = value / 255;
                      return normalized <= 0.03928 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
                    };
                    return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
                  };
                  const contrast = (foreground, background) => {
                    const a = luminance(foreground);
                    const b = luminance(background);
                    return (Math.max(a,b) + 0.05) / (Math.min(a,b) + 0.05);
                  };
                  const findBackground = (element) => {
                    let current = element.parentElement;
                    while (current) {
                      const background = parse(getComputedStyle(current).backgroundColor);
                      if (background && background.a >= 0.99) return background;
                      current = current.parentElement;
                    }
                    return parse(getComputedStyle(document.body).backgroundColor) || {r:255,g:255,b:255,a:1};
                  };
                  return [...document.querySelectorAll('h1,h2,h3')]
                    .filter((heading) => heading.textContent?.trim())
                    .map((heading) => {
                      const style = getComputedStyle(heading);
                      const foreground = parse(style.color);
                      const background = findBackground(heading);
                      if (!foreground || !background || foreground.a < 0.99) return null;
                      const fontSize = parseFloat(style.fontSize);
                      const fontWeight = Number(style.fontWeight) || 400;
                      const required = fontSize >= 24 || fontWeight >= 700 ? 3 : 4.5;
                      return {
                        text: heading.textContent.trim().slice(0, 100),
                        foreground: style.color,
                        background: `rgb(${background.r}, ${background.g}, ${background.b})`,
                        ratio: Number(contrast(foreground, background).toFixed(2)),
                        required
                      };
                    }).filter(Boolean);
                });

                expect(
                  headingContrast.filter((item) => item.ratio < item.required),
                  `${theme} heading contrast failures on ${route}: ${JSON.stringify(headingContrast)}`
                ).toEqual([]);

                const results = await page.evaluate(async () => window.axe.run(document, {
                  runOnly: ['wcag2a', 'wcag2aa']
                }));

                expect(
                  results.violations,
                  `${theme} accessibility violations: ${JSON.stringify(results.violations)}`
                ).toEqual([]);
              });
            }
          }
          TEST

          npx playwright test tests-accessibility.spec.cjs --reporter=line

      - name: Run Lighthouse accessibility audit
        run: |
          cat > lighthouserc.cjs <<'LIGHTHOUSE'
          module.exports = {
            ci: {
              collect: {
                url: [
                  'http://127.0.0.1:4321/',
                  'http://127.0.0.1:4321/work/',
                  'http://127.0.0.1:4321/experience/',
                  'http://127.0.0.1:4321/technology/',
                  'http://127.0.0.1:4321/status/',
                  'http://127.0.0.1:4321/about/',
                  'http://127.0.0.1:4321/contact/'
                ],
                numberOfRuns: 1,
                settings: { onlyCategories: ['accessibility'] }
              },
              assert: {
                assertions: {
                  'categories:accessibility': ['error', { minScore: 0.95 }]
                }
              },
              upload: { target: 'filesystem', outputDir: '.lighthouseci' }
            }
          };
          LIGHTHOUSE

          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-diagnostics
          path: |
            /tmp/alienx-accessibility.log
            .lighthouseci
            test-results
          if-no-files-found: ignore
