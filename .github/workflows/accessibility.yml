name: AlienX Accessibility & Theme Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Light, dark, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-accessibility.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-accessibility.log
          exit 1

      - name: Install browser accessibility tooling
        run: |
          npx playwright install --with-deps chromium

      - name: Test system and explicit themes with axe
        run: npx playwright test tests/accessibility.spec.cjs --reporter=line

      - name: Run Lighthouse accessibility audit
        run: |

          node scripts/lighthouse.mjs --accessibility

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-diagnostics
          path: |
            /tmp/alienx-accessibility.log
            .lighthouseci
            test-results
          if-no-files-found: ignore
          include-hidden-files: true
