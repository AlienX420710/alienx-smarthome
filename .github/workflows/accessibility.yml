name: AlienX Accessibility & Theme Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Light, dark, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start Cloudflare preview
        run: npx wrangler dev --port 4321 > /tmp/alienx-accessibility.log 2>&1 &

      - name: Wait for preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/alienx-accessibility.log
          exit 1

      - name: Install browser accessibility tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Test light and dark themes with axe
        run: |
          cat > tests-accessibility.spec.cjs <<'TEST'
          const { test, expect } = require('@playwright/test');
          const axe = require('axe-core');

          const baseURL = 'http://127.0.0.1:4321';
          const routes = ['/', '/work/', '/experience/', '/technology/', '/status/', '/about/', '/contact/'];
          const themes = ['light', 'dark'];

          test.describe.configure({ mode: 'serial' });

          for (const theme of themes) {
            for (const route of routes) {
              test(`${theme} theme: ${route}`, async ({ page }) => {
                // The production CSP intentionally blocks inline script injection. Install
                // axe before navigation through Playwright's pre-document hook instead.
                await page.addInitScript({ content: axe.source });
                await page.emulateMedia({ colorScheme: theme, reducedMotion: 'reduce' });
                await page.goto(`${baseURL}${route}`, { waitUntil: 'domcontentloaded' });

                // Status renders its checks asynchronously. Do not run axe against the
                // empty loading state; audit the fully rendered page instead.
                if (route === '/status/') {
                  await expect(page.locator('#checks')).toHaveAttribute('aria-busy', 'false', { timeout: 5000 });
                  await expect(page.locator('#checks .check')).toHaveCount(4, { timeout: 1000 });
                } else {
                  await page.waitForTimeout(500);
                }

                const results = await page.evaluate(async () => window.axe.run(document, {
                  runOnly: ['wcag2a', 'wcag2aa']
                }));

                expect(
                  results.violations,
                  `${theme} accessibility violations: ${JSON.stringify(results.violations)}`
                ).toEqual([]);
              });
            }
          }
          TEST

          npx playwright test tests-accessibility.spec.cjs --reporter=line

      - name: Run Lighthouse accessibility audit
        run: |
          cat > lighthouserc.cjs <<'LIGHTHOUSE'
          module.exports = {
            ci: {
              collect: {
                url: [
                  'http://127.0.0.1:4321/',
                  'http://127.0.0.1:4321/work/',
                  'http://127.0.0.1:4321/experience/',
                  'http://127.0.0.1:4321/technology/',
                  'http://127.0.0.1:4321/status/',
                  'http://127.0.0.1:4321/about/',
                  'http://127.0.0.1:4321/contact/'
                ],
                numberOfRuns: 1,
                settings: { onlyCategories: ['accessibility'] }
              },
              assert: {
                assertions: {
                  'categories:accessibility': ['error', { minScore: 0.95 }]
                }
              },
              upload: { target: 'filesystem', outputDir: '.lighthouseci' }
            }
          };
          LIGHTHOUSE

          npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.cjs

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-diagnostics
          path: |
            /tmp/alienx-accessibility.log
            .lighthouseci
            test-results
          if-no-files-found: ignore
