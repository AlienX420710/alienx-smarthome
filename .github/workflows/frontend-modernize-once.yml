name: Frontend Modernization One Shot

on:
  push:
    branches:
      - feat/frontend-modernization
    paths:
      - scripts/modernize-frontend-once.py
      - .github/workflows/frontend-modernize-once.yml

permissions:
  contents: write

jobs:
  modernize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/frontend-modernization
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/modernize-frontend-once.py
      - run: npx prettier --write src/components/Header.astro src/components/Footer.astro src/pages/index.astro src/pages/work.astro src/pages/contact.astro src/pages/lab.astro
      - run: npm run format:check
      - name: Commit generated modernization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): modernize production patterns and expand lab"
          git push origin HEAD:feat/frontend-modernization
