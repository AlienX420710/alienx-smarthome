<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="60%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="headMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="15%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="85%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#c6ff9e"/>
      <stop offset="45%" stop-color="#5aff3d"/>
      <stop offset="100%" stop-color="#0f5c0a"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- square black background -->
  <rect x="0" y="0" width="512" height="512" fill="#000000"/>

  <!-- glow behind head -->
  <ellipse cx="256" cy="270" rx="180" ry="205" fill="url(#glow)"/>

  <!-- alien head -->
  <g>
    <path d="M256,90
             C 350,90 395,195 385,285
             C 377,360 335,400 302,435
             C 280,458 269,470 256,470
             C 243,470 232,458 210,435
             C 177,400 135,360 127,285
             C 117,195 162,90 256,90 Z"
          fill="url(#headMetal)" stroke="#000" stroke-width="1"/>

    <!-- forehead ridge shading -->
    <path d="M256,112 C 245,180 248,258 256,330" stroke="#000" stroke-width="10"
          fill="none" opacity="0.35" filter="url(#blur1)"/>

    <!-- eye glow bloom (behind eye shapes) -->
    <ellipse cx="180" cy="255" rx="58" ry="17" fill="#33ff33" opacity="0.35" filter="url(#blur2)" transform="rotate(-16 180 255)"/>
    <ellipse cx="332" cy="255" rx="58" ry="17" fill="#33ff33" opacity="0.35" filter="url(#blur2)" transform="rotate(16 332 255)"/>

    <!-- eyes: classic symmetric almond, pointed corners, outer edge angled up -->
    <path d="M -55,0 C -22,-16 22,-16 55,0 C 22,12 -22,12 -55,0 Z"
          fill="url(#eyeGlow)" transform="translate(180,255) rotate(-16)"/>
    <path d="M -55,0 C -22,-16 22,-16 55,0 C 22,12 -22,12 -55,0 Z"
          fill="url(#eyeGlow)" transform="translate(332,255) rotate(16)"/>
  </g>
</svg>
